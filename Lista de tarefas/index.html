<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f3">
  <link rel="stylesheet" href="style.css">
  <title>Hoje em dia — Lista de tarefas</title>

</head>

<body>
  <main class="shell">
    <header class="topline">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✓</span> Hoje em dia</div>
      <div class="local-note">Seus dados ficam salvos neste dispositivo</div>
    </header>
    <section class="hero">
      <div>
        <p class="eyebrow">Seu espaço de foco</p>
        <h1>Um passo de cada vez.</h1>
        <p class="subtitle">Organize o que importa e siga no seu ritmo.</p>
      </div>
      <div class="date-pill" id="today-label"></div>
    </section>
    <div class="layout">
      <section class="main-panel" aria-labelledby="list-title">
        <div class="panel-heading">
          <div>
            <h2 id="list-title">Suas tarefas</h2><span class="count" id="task-count">0 tarefas</span>
          </div>
          <div class="filters" aria-label="Filtrar tarefas">
            <button class="filter" type="button" data-filter="all" aria-pressed="true">Todas</button>
            <button class="filter" type="button" data-filter="active" aria-pressed="false">Em aberto</button>
            <button class="filter" type="button" data-filter="done" aria-pressed="false">Concluídas</button>
          </div>
        </div>
        <div class="task-list" id="task-list" aria-live="polite"></div>
        <div class="footer"><span id="remaining"></span><span>Feito com calma, feito.</span></div>
      </section>
      <aside class="form-panel">
        <h2>Nova tarefa</h2>
        <p class="form-help">Anote e escolha quando e como fazer.</p>
        <form id="task-form" novalidate>
          <div class="field"><label for="task-title">O que você precisa fazer?</label><input id="task-title"
              name="title" type="text" maxlength="120" placeholder="Ex.: Revisar apresentação" required></div>
          <div class="field"><label for="task-priority">Prioridade</label><select id="task-priority" name="priority">
              <option value="medium">Média</option>
              <option value="high">Alta</option>
              <option value="low">Baixa</option>
            </select></div>
          <div class="field"><label for="task-date">Prazo final</label><input id="task-date" name="date" type="date">
          </div>
          <button class="submit" type="submit">＋ &nbsp;Adicionar tarefa</button>
          <p class="form-error" id="form-error" role="alert"></p>
        </form>
      </aside>
    </div>
  </main>

  <script src="script.js"></script>

</body>

</html>
